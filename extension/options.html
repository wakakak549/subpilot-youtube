<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubPilot · 设置</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="brand"><img src="icons/icon48.png" alt=""><div><h1>SubPilot</h1><p class="muted">YouTube AI 双语字幕 · 设置</p></div></div>
      <a href="https://developers.openai.com/api/docs/models/gpt-6.1-sol" target="_blank" rel="noopener noreferrer">模型文档</a>
    </header>
    <form id="configForm">
      <section class="section">
        <div class="section-title"><h2>翻译接口</h2><label class="check"><input id="enabled" type="checkbox">启用翻译</label></div>
        <div class="fields">
          <div class="field full"><label for="baseURL">API 地址</label><input id="baseURL" type="url" required placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false"></div>
          <div class="field full"><label for="apiKey">API 密钥</label><div class="input-group"><input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="本地接口可留空"><button type="button" id="toggleKey" class="icon-button" title="显示密钥" aria-label="显示密钥"><i data-lucide="eye"></i></button></div></div>
          <div class="field"><label for="model">模型</label><div class="input-group"><input id="model" type="text" list="modelOptions" required placeholder="gpt-6.1-sol" autocomplete="off" spellcheck="false"><button type="button" id="loadModels" class="icon-button" title="获取模型列表" aria-label="获取模型列表"><i data-lucide="refresh-cw"></i></button></div><datalist id="modelOptions"></datalist></div>
          <div class="field"><label for="targetLang">目标语言</label><select id="targetLang"><option>简体中文</option><option>繁體中文</option><option>English</option><option>日本語</option><option>한국어</option></select></div>
        </div>
        <details>
          <summary>接口兼容设置</summary>
          <div class="fields">
            <div class="field"><label for="apiFormat">接口类型</label><select id="apiFormat"><option value="auto">自动识别</option><option value="openai">OpenAI</option><option value="compatible">LM Studio / 兼容接口</option></select></div>
            <div class="field"><label for="reasoningEffort">推理强度</label><select id="reasoningEffort" title="接口不支持推理参数时选择自动"><option value="auto">自动</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></div>
            <div class="field"><label>输出格式</label><label class="check"><input id="structuredOutput" type="checkbox">严格 JSON 输出</label></div>
            <div class="field"><label for="requestTimeoutSeconds">响应超时（秒）</label><input id="requestTimeoutSeconds" type="number" min="15" max="300" step="1" required></div>
          </div>
        </details>
      </section>
      <section class="section">
        <div class="section-title"><h2>字幕显示</h2></div>
        <div class="fields">
          <div class="field full"><label>显示模式</label><div class="segments" role="group" aria-label="显示模式"><label><input type="radio" name="viewMode" value="bilingual">双语</label><label><input type="radio" name="viewMode" value="translated">译文</label><label><input type="radio" name="viewMode" value="original">原文</label></div></div>
          <div class="field"><div class="range-label"><label for="originalFont">原文字号</label><output id="originalFontValue"></output></div><input id="originalFont" type="range" min="12" max="32" step="1"></div>
          <div class="field"><div class="range-label"><label for="translatedFont">译文字号</label><output id="translatedFontValue"></output></div><input id="translatedFont" type="range" min="12" max="36" step="1"></div>
        </div>
      </section>
      <section class="section">
        <div class="section-title"><h2>提前翻译</h2></div>
        <div class="fields">
          <div class="field"><div class="range-label"><label for="prefetchSeconds">预取时长</label><output id="prefetchSecondsValue"></output></div><input id="prefetchSeconds" type="range" min="15" max="600" step="5"></div>
          <div class="field"><label for="batchSize">每次翻译段数</label><input id="batchSize" type="number" min="1" max="100" step="1" required></div>
        </div>
      </section>
      <section class="section"><div class="section-title"><h2>本地缓存</h2></div><div class="cache-row"><p id="cacheStats" class="muted">正在读取</p><button type="button" id="clearCache" class="danger"><i data-lucide="trash-2"></i>清空缓存</button></div></section>
      <footer class="footer"><div class="actions"><button id="save" type="submit" class="primary"><i data-lucide="save"></i>保存配置</button><button id="test" type="button"><i data-lucide="plug-zap"></i>测试连接</button></div><p id="notice" role="status" aria-live="polite"></p></footer>
    </form>
  </main>
  <script src="lib/core.js"></script><script src="vendor/icons.js"></script><script src="lib/ui.js"></script><script src="options.js"></script>
</body>
</html>
